specVersion: 0.0.4
description: YeeterSubgraph
repository: 'https://github.com/0xBootleggers/yeeter-subgraph'
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum/contract
    name: summoner
    network: optimism
    source:
      address: '0x3E0eAdE343Ddc556a6Cf0f858e4f685ba303ce71'
      abi: summoner
      startBlock: 116176243
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      entities:
        - Dao
      abis:
        - name: summoner
          file: ./abis/summoner.json
        - name: Erc20
          file: ./abis/erc20.json
      eventHandlers:
        - event: >-
            SummonBaal(indexed address,indexed address,indexed
            address,address,address,uint256)
          handler: handleSummonBaal
        - event: 'DaoReferral(bytes32,address)'
          handler: handleDaoReferral
      file: ./src/summoner-mapping.ts
  - kind: ethereum/contract
    name: yeeterFactory
    network: optimism
    source:
      address: '0x97d7753882f8bAb3E96EFD9a8a17CA1C769Cd7cC'
      abi: yeeterFactory
      startBlock: 136729967
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      entities:
        - Dao
        - Yeeter
      abis:
        - name: yeeterFactory
          file: ./abis/yeeterFactory.json
        - name: YeeterShaman
          file: ./abis/yeeterShaman.json
      eventHandlers:
        - event: 'CreateUnsetEthYeeter(indexed address,address)'
          handler: handleCreateUnsetEthYeeter
      file: ./src/summoner-mapping.ts
templates:
  - kind: ethereum/contract
    name: BaalTemplate
    network: optimism
    source:
      abi: Baal
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      file: ./src/baal-mapping.ts
      entities:
        - Dao
      abis:
        - name: Baal
          file: ./abis/baal.json
        - name: YeeterShaman
          file: ./abis/yeeterShaman.json
        - name: Erc20
          file: ./abis/erc20.json
        - name: Erc20YeeterShaman
          file: ./abis/erc20YeeterShaman.json
      eventHandlers:
        - event: 'ShamanSet(indexed address,uint256)'
          handler: handleShamanSet
  - kind: ethereum/contract
    name: YeeterShamanTemplate
    network: optimism
    source:
      abi: YeeterShaman
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      file: ./src/yeeter-mapping.ts
      entities:
        - Dao
        - Yeeter
        - Yeets
      abis:
        - name: YeeterShaman
          file: ./abis/yeeterShaman.json
      eventHandlers:
        - event: 'OnReceived(indexed address,uint256,uint256,address,address,string)'
          handler: handleOnReceived
  - kind: ethereum/contract
    name: Erc20YeeterShamanTemplate
    network: optimism
    source:
      abi: Erc20YeeterShaman
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      file: ./src/yeeter-mapping.ts
      entities:
        - Dao
        - Yeeter
        - Yeets
      abis:
        - name: Erc20YeeterShaman
          file: ./abis/erc20YeeterShaman.json
        - name: Erc20
          file: ./abis/erc20.json
        - name: Erc20Bytes32
          file: ./abis/erc20Bytes32.json
      eventHandlers:
        - event: >-
            OnReceivedERC20(indexed
            address,uint256,uint256,address,address,string,address)
          handler: handleOnReceivedERC20
